[build]
  # Prevent Netlify from publishing "frontend/frontend":
  # - base = "frontend"
  # - publish = "." (publish the base directory itself)
  base = "frontend"
  publish = "."

# NOTE:
# - Deploy your backend to Render (example: https://your-backend.onrender.com)
# - Then replace the URLs below with your real Render URL.
#
# This keeps frontend requests like /api/... and /images/uploads/... working on Netlify.

[[redirects]]
  from = "/api/*"
  to = "https://agricatch.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/uploads/*"
  to = "https://agricatch.onrender.com/images/uploads/:splat"
  status = 200
  force = true

