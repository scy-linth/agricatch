<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>404 - Page Not Found | AgriCatch</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="images/Farm Fresh.png" rel="icon">

  <!-- Google Fonts (match all other pages) -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/agricatch-polish.css?v=2">

  <style>
    :root {
      --ac-primary: #2d7a3a;
      --ac-primary-dark: #1e5429;
      --ac-primary-light: #e8f5e9;
      --primary-color: #4ade80;
      --secondary-color: #0ea5e9;
      --ac-bg: #f5f7f5;
      --ac-text: #1a2e1e;
      --ac-text-muted: #6b7e72;
    }
    body {
      font-family: 'Inter', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--ac-bg);
      color: var(--ac-text);
    }
    .error-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .error-404 h1 {
      font-size: 8rem;
      font-weight: 700;
      color: var(--ac-primary);
      line-height: 1;
    }
    .error-404 h2 {
      font-size: 2rem;
      font-weight: 600;
      color: var(--ac-text);
      margin-bottom: 1.5rem;
    }
    .error-404 .btn {
      background: var(--ac-primary);
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-bottom: 2rem;
      box-shadow: 0 4px 15px rgba(45, 122, 58, 0.3);
    }
    .error-404 .btn:hover {
      background: var(--ac-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(45, 122, 58, 0.4);
    }
    .error-404 img {
      max-width: 400px;
      height: auto;
    }
    .credits {
      font-size: 0.9rem;
      color: var(--ac-text-muted);
    }
    .credits a {
      color: var(--ac-primary);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <section class="error-404">
        <h1>404</h1>
        <h2>The page you are looking for doesn't exist.</h2>
        <a class="btn" href="/">Back to Home</a>
        <img src="https://cdn-icons-png.flaticon.com/512/7486/7486754.png" class="img-fluid py-5" alt="Page Not Found">
        <div class="credits">
          <p>AgriCatch - Fresh Agricultural Products Marketplace</p>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
