<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers - AgriCatch</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/agricatch-polish.css?v=2">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <div class="logo-and-title">
                        <img src="/images/logo.png" alt="AgriCatch Logo" class="inline-logo">
                        <h1><span class="agri-green">Agri</span><span class="catch-blue">Catch</span></h1>
                    </div>
                    <p class="tagline">Freshly Harvested! Pre-ordered for you!</p>
                </div>
                <nav class="nav" id="main-nav">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/#products" class="nav-link">Products</a>
                    <a href="/farmers.html" class="nav-link active">Farmers</a>
                </nav>
                <div class="header-actions">
                    <a href="/" class="btn btn-secondary">Back to Shop</a>
                </div>
            </div>
        </div>
    </header>

    <main class="farmers-page">
        <div class="container">
            <div class="farmers-header">
                <h2>Meet Our Farmers</h2>
                <p>Discover trusted local farmers and their fresh products.</p>
                <div class="farmers-filters">
                    <input type="text" id="farmer-search" placeholder="Search farmers..." class="search-input">
                </div>
            </div>

            <div id="farmers-grid" class="farmers-grid">
                <!-- Farmers will be loaded here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>AgriCatch</h3>
                    <p>Freshly Harvested! Pre-ordered for you! Your trusted source for fresh farm products.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 AgriCatch. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="/js/format.js"></script>
    <script src="/js/farmers.js"></script>
    <script>
        // Mobile menu toggle
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');
        if (mobileMenuToggle && mainNav) {
            mobileMenuToggle.addEventListener('click', () => {
                mainNav.classList.toggle('open');
                const icon = mobileMenuToggle.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                }
            });
        }
    </script>
  <script src="/js/validation-standardizer.js"></script>
</body>
</html>
