<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - AgriCatch</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/agricatch-polish.css?v=2">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-and-title">
                        <img src="/images/logo.png" alt="AgriCatch Logo" class="inline-logo">
                        <h1><span class="agri-green">Agri</span><span class="catch-blue">Catch</span></h1>
                    </div>
                    <p class="tagline">Freshly Harvested! Pre-ordered for you!</p>
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/#products" class="nav-link">Products</a>
                    <a href="/wishlist.html" class="nav-link active">Wishlist</a>
                </nav>
                <div class="header-actions">
                    <a href="/" class="btn btn-secondary">Back to Shop</a>
                </div>
            </div>
        </div>
    </header>

    <main class="wishlist-page">
        <div class="container">
            <div class="wishlist-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
                <div>
                    <h2>My Wishlist <span id="wishlist-count-badge" style="font-size:0.9rem;font-weight:500;color:#6b7280;"></span></h2>
                    <p>Save items you want to buy later.</p>
                </div>
                <button id="wishlist-add-all-btn" class="btn btn-primary" style="display:none;">
                    <i class="fas fa-cart-plus"></i> Add All to Cart
                </button>
            </div>
            <div class="wishlist-filters" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
                <label for="wishlist-sort" style="font-size:0.9rem;font-weight:500;">Sort by:</label>
                <select id="wishlist-sort" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:0.9rem;">
                    <option value="date_desc">Newest First</option>
                    <option value="date_asc">Oldest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
                <select id="wishlist-filter-category" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:0.9rem;">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div id="wishlist-grid" class="products-grid">
                <!-- Wishlist items will be rendered here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>AgriCatch</h3>
                    <p>Freshly Harvested! Pre-ordered for you! Your trusted source for fresh farm products.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 AgriCatch. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="/js/format.js"></script>
    <script src="/js/wishlist.js"></script>
</body>
</html>
