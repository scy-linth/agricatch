<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — AgriCatch</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">

    <!-- NiceAdmin base -->
    <link rel="stylesheet" href="/css/nicemain.css">
    <!-- AgriCatch SaaS overrides -->
    <link rel="stylesheet" href="/css/agricatch-admin.css">
    <link rel="stylesheet" href="/css/agricatch-polish.css?v=2">
    <!-- Legacy styles for product card rendering -->
    <link rel="stylesheet" href="/css/styles.css">

<style>
/* ── Wishlist page — standalone customer view ─────────────── */

/* Topbar — gradient matching landing page header */
.wishlist-topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1030;
  height: 60px;
  background: linear-gradient(135deg, #4ade80, #0ea5e9);
  display: flex;
  align-items: center;
  padding: 0 1.25rem;
  gap: 1rem;
  backdrop-filter: blur(10px);
}
.wishlist-topbar .brand-name {
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -.3px;
  color: #fff;
}
.wishlist-topbar .tagline {
  font-size: .7rem;
  color: rgba(255,255,255,.8);
  margin: 0;
  line-height: 1;
}
.wishlist-topbar .back-btn {
  background: rgba(255,255,255,.35);
  color: #fff;
  border: 1px solid rgba(255,255,255,.5);
  font-size: .8rem;
  font-weight: 600;
  padding: .3rem .75rem;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  text-decoration: none;
  transition: background .15s;
  flex-shrink: 0;
  position: static;
  left: auto;
}
.wishlist-topbar .back-btn:hover {
  background: rgba(255,255,255,.5);
  color: #fff;
  text-decoration: none;
}

/* Main area */
#wishlist-main {
  margin-top: 60px;
  padding: 1.5rem 1.75rem 3rem;
  min-height: calc(100vh - 60px);
  background: var(--ac-bg, #f5f7f5);
}
@media (max-width: 767px) {
  #wishlist-main { padding: 1rem .75rem 2.5rem; }
  .wishlist-topbar { padding: 0 .75rem; }
}

/* Wishlist filters */
.wishlist-filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 16px;
}
.wishlist-filters label {
  font-size: 0.9rem;
  font-weight: 500;
}
.wishlist-filters select {
  padding: 6px 10px;
  border: 1px solid var(--ac-border, #e2e8e4);
  border-radius: 8px;
  font-size: 0.9rem;
  background: #fff;
  outline: none;
  transition: border-color .15s;
}
.wishlist-filters select:focus {
  border-color: var(--ac-primary, #2d7a3a);
  box-shadow: 0 0 0 3px rgba(45,122,58,.12);
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--ac-text-muted, #6b7e72);
  font-size: .9rem;
}
.empty-state i {
  font-size: 2.5rem;
  display: block;
  margin-bottom: .75rem;
  color: var(--ac-primary-muted, #c8e6c9);
}

/* btn-small — alias for Bootstrap btn-sm */
.btn.btn-small {
  padding: .25rem .6rem;
  font-size: .78rem;
  border-radius: .4rem;
  font-weight: 600;
}

/* Unavailable product card — greyed out */
.product-card-unavailable {
  opacity: 0.75;
  filter: grayscale(0.3);
  pointer-events: none;
}
.product-card-unavailable .product-actions,
.product-card-unavailable .wishlist-toggle-btn {
  pointer-events: auto;
}

/* Bootstrap button overrides (brand colours) */
.btn-ac-green {
  background: var(--ac-primary, #2d7a3a);
  color: #fff;
  border-color: var(--ac-primary, #2d7a3a);
}
.btn-ac-green:hover {
  background: var(--ac-primary-dark, #1e5429);
  color: #fff;
  border-color: var(--ac-primary-dark, #1e5429);
}
</style>
</head>

<body class="loading" style="background:var(--ac-bg,#f5f7f5);">

<!-- Loading Screen -->
<div id="loading-screen" class="loading-screen">
    <div class="loading-content">
        <div class="loading-logo">
            <img src="/images/logo.png" alt="AgriCatch Logo" class="loading-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="loading-logo-fallback" style="display:none; align-items:center; justify-content:center; width:60px; height:60px; background:rgba(255,255,255,0.2); border-radius:50%; font-size:1.5rem; font-weight:bold; color:white;">AC</div>
            <h1 class="loading-title">
                <span class="agri-green">Agri</span><span class="catch-blue">Catch</span>
            </h1>
        </div>
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
        <p class="loading-text">Loading...</p>
    </div>
</div>

<!-- ── Top bar ───────────────────────────────────────────────────────── -->
<header class="wishlist-topbar">
    <a href="/index.html" class="d-flex align-items-center gap-2" style="text-decoration:none;">
        <img src="/images/logo.png" alt="AgriCatch" height="34" style="flex-shrink:0;">
        <div>
            <div class="brand-name">AgriCatch</div>
            <p class="tagline">Freshly Harvested! Pre-ordered for you!</p>
        </div>
    </a>

    <a href="/index.html" id="back-to-origin-btn" class="back-btn ms-auto" style="margin-left:auto;flex-shrink:0;" onclick="restoreLandingPagePosition(event)">
        <i class="bi bi-arrow-left"></i>
        <span>Back</span>
    </a>
</header>

<!-- ── Main content ──────────────────────────────────────────────────── -->
<main id="wishlist-main">

    <!-- Breadcrumb -->
    <div class="pagetitle">
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Home</li>
                <li class="breadcrumb-item active">My Wishlist</li>
            </ol>
        </nav>
    </div>

    <!-- Wishlist section -->
    <section id="wishlist" class="admin-section-card active">
        <div class="ac-section-hero ac-section-hero--primary mb-4">
            <div class="ac-section-hero__icon"><i class="bi bi-heart"></i></div>
            <div class="ac-section-hero__body">
                <h4 class="ac-section-hero__title">My Wishlist <span id="wishlist-count-badge" style="font-size:0.85rem;font-weight:500;color:var(--ac-text-muted,#6b7e72);"></span></h4>
                <p class="ac-section-hero__sub">Save items you want to buy later.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body px-3 pt-3 pb-2">

            <!-- Filters -->
            <div class="wishlist-filters">
                <label for="wishlist-sort">Sort by:</label>
                <select id="wishlist-sort">
                    <option value="date_desc">Newest First</option>
                    <option value="date_asc">Oldest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
                <select id="wishlist-filter-category">
                    <option value="">All Categories</option>
                </select>
            </div>

            <!-- Wishlist grid -->
            <div id="wishlist-grid" class="products-grid">
                <!-- Wishlist items will be rendered here -->
            </div>

        </div>
    </div>
    </section>

</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/format.js"></script>
<script src="/js/wishlist.js"></script>
<script>
// Authorization check - redirect if not logged in or not customer
(function() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/index.html#login';
        return;
    }
    try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const role = payload.role;
        if (role === 'farmer') {
            window.location.href = '/farmer.html';
        } else if (role === 'admin' || role === 'super_admin') {
            window.location.href = '/admin.html';
        }
    } catch (e) {
        window.location.href = '/index.html';
    }
})();

// Restore landing page scroll position
function restoreLandingPagePosition(event) {
    const scrollY = sessionStorage.getItem('landingPageScrollY');
    const hash = sessionStorage.getItem('landingPageHash');
    if (scrollY) {
        sessionStorage.setItem('restoreScrollY', scrollY);
        sessionStorage.setItem('restoreHash', hash || '#home');
    }
}

// Hide loading screen when page is fully loaded
window.addEventListener('load', function() {
    const loadingScreen = document.getElementById('loading-screen');
    const body = document.body;

    if (loadingScreen) {
        setTimeout(() => {
            loadingScreen.classList.add('hidden');
            body.classList.remove('loading');
        }, 50);
    }
});

// Fallback: Hide loading screen after 1.5 seconds even if page doesn't fully load
setTimeout(function() {
    const loadingScreen = document.getElementById('loading-screen');
    const body = document.body;

    if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
        console.warn('Loading screen timeout - forcing hide');
        loadingScreen.classList.add('hidden');
        body.classList.remove('loading');
    }
}, 1500);
</script>
</body>
</html>
