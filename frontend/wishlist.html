<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - AgriCatch</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-and-title">
                        <img src="/images/logo.png" alt="AgriCatch Logo" class="inline-logo">
                        <h1><span class="agri-green">Agri</span><span class="catch-blue">Catch</span></h1>
                    </div>
                    <p class="tagline">Freshly Caught! Pre-ordered for you!</p>
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/#products" class="nav-link">Products</a>
                    <a href="/wishlist.html" class="nav-link active">Wishlist</a>
                </nav>
                <div class="header-actions">
                    <a href="/" class="btn btn-secondary">Back to Shop</a>
                </div>
            </div>
        </div>
    </header>

    <main class="wishlist-page">
        <div class="container">
            <div class="wishlist-header">
                <h2>My Wishlist</h2>
                <p>Save items you want to buy later.</p>
            </div>
            <div id="wishlist-grid" class="products-grid">
                <!-- Wishlist items will be rendered here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>AgriCatch</h3>
                    <p>Freshly Caught! Pre-ordered for you! Your trusted source for fresh agricultural and fishery products.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 AgriCatch. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../public/js/wishlist.js"></script>
</body>
</html>
