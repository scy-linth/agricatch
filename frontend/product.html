<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - AgriCatch</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <div class="logo-and-title">
                        <img src="/images/logo.png" alt="AgriCatch Logo" class="inline-logo">
                        <h1><span class="agri-green">Agri</span><span class="catch-blue">Catch</span></h1>
                    </div>
                    <p class="tagline">Freshly Caught! Pre-ordered for you!</p>
                </div>
                <nav class="nav" id="main-nav">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/#products" class="nav-link">Products</a>
                    <a href="/product.html" class="nav-link active">Product</a>
                </nav>
                <div class="header-actions">
                    <a href="/" class="btn btn-secondary">Back to Shop</a>
                </div>
            </div>
        </div>
    </header>

    <main class="product-page">
        <div class="container">
            <div id="product-detail" class="product-detail">
                <!-- Product details will be loaded here -->
            </div>
            <div class="reviews-section">
                <h3>Reviews</h3>
                <div id="reviews-list" class="reviews-list"></div>
                <form id="review-form" class="review-form">
                    <div class="form-group">
                        <label for="review-rating">Rating (1-5)</label>
                        <input type="number" id="review-rating" min="1" max="5" required>
                    </div>
                    <div class="form-group">
                        <label for="review-comment">Comment</label>
                        <textarea id="review-comment" rows="3" placeholder="Share your experience..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>AgriCatch</h3>
                    <p>Freshly Caught! Pre-ordered for you! Your trusted source for fresh agricultural and fishery products.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 AgriCatch. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../public/js/product.js"></script>
    <script>
        // Mobile menu toggle
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');
        if (mobileMenuToggle && mainNav) {
            mobileMenuToggle.addEventListener('click', () => {
                mainNav.classList.toggle('open');
                const icon = mobileMenuToggle.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                }
            });
        }
    </script>
</body>
</html>
