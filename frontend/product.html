<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - AgriCatch</title>
    <meta name="description" content="Fresh farm products available for pre-order on AgriCatch.">
    <meta property="og:title" content="Product Details - AgriCatch">
    <meta property="og:description" content="Fresh farm products available for pre-order on AgriCatch.">
    <meta property="og:image" content="/images/logo.png">
    <meta property="og:type" content="product">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <div class="logo-and-title">
                        <img src="/images/logo.png" alt="AgriCatch Logo" class="inline-logo">
                        <h1><span class="agri-green">Agri</span><span class="catch-blue">Catch</span></h1>
                    </div>
                    <p class="tagline">Freshly Harvested! Pre-ordered for you!</p>
                </div>
                <nav class="nav" id="main-nav">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/#products" class="nav-link">Products</a>
                    <a href="/product.html" class="nav-link active">Product</a>
                </nav>
                <div class="header-actions">
                    <a href="/" class="btn btn-secondary">Back to Shop</a>
                </div>
            </div>
        </div>
    </header>

    <main class="product-page">
        <div class="container">
            <div id="product-detail" class="product-detail">
                <!-- Product details will be loaded here -->
            </div>
            <div class="reviews-section">
                <h3>Similar Farmer Shops</h3>
                <div id="similar-sellers-list" class="reviews-list"></div>
            </div>
            <div class="reviews-section">
                <h3>Reviews</h3>
                <div id="reviews-list" class="reviews-list"></div>
                <form id="review-form" class="review-form">
                    <div class="form-group">
                        <label>Your Rating <span class="required">*</span></label>
                        <div id="review-rating-stars" class="review-rating-stars" style="display:flex;gap:6px;margin:4px 0;">
                            <button type="button" class="review-star-btn" data-rating="1" aria-label="1 star" style="background:none;border:none;cursor:pointer;font-size:1.8rem;color:#d1d5db;padding:0;line-height:1;transition:color .15s"><i class="fas fa-star"></i></button>
                            <button type="button" class="review-star-btn" data-rating="2" aria-label="2 stars" style="background:none;border:none;cursor:pointer;font-size:1.8rem;color:#d1d5db;padding:0;line-height:1;transition:color .15s"><i class="fas fa-star"></i></button>
                            <button type="button" class="review-star-btn" data-rating="3" aria-label="3 stars" style="background:none;border:none;cursor:pointer;font-size:1.8rem;color:#d1d5db;padding:0;line-height:1;transition:color .15s"><i class="fas fa-star"></i></button>
                            <button type="button" class="review-star-btn" data-rating="4" aria-label="4 stars" style="background:none;border:none;cursor:pointer;font-size:1.8rem;color:#d1d5db;padding:0;line-height:1;transition:color .15s"><i class="fas fa-star"></i></button>
                            <button type="button" class="review-star-btn" data-rating="5" aria-label="5 stars" style="background:none;border:none;cursor:pointer;font-size:1.8rem;color:#d1d5db;padding:0;line-height:1;transition:color .15s"><i class="fas fa-star"></i></button>
                        </div>
                        <input type="hidden" id="review-rating" value="0">
                        <small id="review-rating-label" style="color:#6b7280;">Select a rating</small>
                    </div>
                    <div class="form-group">
                        <label for="review-comment">Comment</label>
                        <textarea id="review-comment" rows="3" placeholder="Share your experience..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>AgriCatch</h3>
                    <p>Freshly Harvested! Pre-ordered for you! Your trusted source for fresh farm products.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 AgriCatch. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="/js/format.js"></script>
    <script src="/js/product.js"></script>
    <script>
        // Mobile menu toggle
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');
        if (mobileMenuToggle && mainNav) {
            mobileMenuToggle.addEventListener('click', () => {
                mainNav.classList.toggle('open');
                const icon = mobileMenuToggle.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                }
            });
        }
    </script>
</body>
</html>
