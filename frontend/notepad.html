<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad - QA Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            background: #f9f9f9;
        }
        .note textarea {
            flex: 1;
            margin-right: 0.5rem;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
        }
        .note button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .note button.save {
            background: #4caf50;
            color: #fff;
        }
        .note button.delete {
            background: #f44336;
            color: #fff;
        }
        .add-note {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
        }
        .add-note textarea {
            flex: 1;
            margin-right: 0.5rem;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
        }
        .add-note button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QA Notepad</h1>
        <div id="notes"></div>
        <div class="add-note">
            <textarea id="new-note" rows="3" placeholder="Write a new note..."></textarea>
            <button id="add-note-btn">Add Note</button>
        </div>
    </div>
    <script>
        const notesContainer = document.getElementById('notes');
        const newNoteInput = document.getElementById('new-note');
        const addNoteBtn = document.getElementById('add-note-btn');

        const loadNotes = () => {
            const notes = JSON.parse(localStorage.getItem('qaNotes') || '[]');
            notesContainer.innerHTML = '';
            notes.forEach((note, index) => {
                const noteElement = document.createElement('div');
                noteElement.className = 'note';
                noteElement.innerHTML = `
                    <textarea rows="3">${note.text}</textarea>
                    <button class="save">Save</button>
                    <button class="delete">Delete</button>
                `;
                noteElement.querySelector('.save').addEventListener('click', () => {
                    const updatedText = noteElement.querySelector('textarea').value;
                    notes[index].text = updatedText;
                    localStorage.setItem('qaNotes', JSON.stringify(notes));
                    loadNotes();
                });
                noteElement.querySelector('.delete').addEventListener('click', () => {
                    notes.splice(index, 1);
                    localStorage.setItem('qaNotes', JSON.stringify(notes));
                    loadNotes();
                });
                notesContainer.appendChild(noteElement);
            });
        };

        addNoteBtn.addEventListener('click', () => {
            const newNoteText = newNoteInput.value.trim();
            if (!newNoteText) return;
            const notes = JSON.parse(localStorage.getItem('qaNotes') || '[]');
            notes.push({ text: newNoteText });
            localStorage.setItem('qaNotes', JSON.stringify(notes));
            newNoteInput.value = '';
            loadNotes();
        });

        loadNotes();
    </script>
</body>
</html>
